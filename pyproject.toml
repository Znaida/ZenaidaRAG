[project]
name = "zenaidarag"
version = "0.1.0"
description = "Asistente RAG de apoyo veterinario: recuperacion semantica, citacion de fuentes y negativa honesta."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rudbel F. Ordaz" }]
keywords = ["rag", "veterinary", "chromadb", "embeddings", "fastapi", "llm"]

dependencies = [
    # CLI
    "typer>=0.12",
    "rich>=13.7",
    # Config
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    # Ingesta (Fase 1)
    "pypdf>=4.2",
    "python-docx>=1.1",
    "pandas>=2.2",
    "openpyxl>=3.1",
    # Embeddings locales (Fase 1, ADR-004)
    "sentence-transformers>=3.0",
    # Vector store (Fase 1, ADR-003)
    "chromadb>=0.5",
    # LLM (Fase 2, ADR-005): OpenAI y Gemini (proveedor por defecto)
    "openai>=1.30",
    "google-genai>=0.3",
    # API (Fase 3)
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.9",
    # Cliente HTTP (canales Fase 5 + healthcheck de la app de escritorio)
    "httpx>=0.27",
    # Busqueda hibrida BM25 (Fase 4, ADR-011)
    "rank-bm25>=0.2",
    # App de escritorio (Fase 7)
    "pywebview>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "httpx>=0.27",
]

[project.scripts]
zenaidarag = "zenaidarag.cli:app"

[project.urls]
Homepage = "https://github.com/Znaida/ZenaidaRAG"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["zenaidarag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: tests que descargan el modelo de embeddings (~470 MB); se omiten en CI con -m 'not slow'",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.coverage.run]
source = ["zenaidarag"]
# Se excluyen wrappers finos de I/O externa y el entrypoint CLI: son
# integraciones verificadas en vivo (Gemini/OpenAI reales, servidor levantado),
# no con unit tests. El gate de 70% aplica a la LOGICA del nucleo RAG.
omit = [
    "zenaidarag/cli.py",
    "zenaidarag/factory.py",
    "zenaidarag/llm/gemini.py",
    "zenaidarag/llm/openai.py",
    "zenaidarag/embeddings/local.py",
]
